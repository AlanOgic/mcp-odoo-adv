version: '3.8'

# Coolify-optimized Docker Compose configuration
# Deploy from Git Repository in Coolify using this file

services:
  # StreamingHTTP Transport (Recommended for Coolify)
  odoo-mcp-http:
    build:
      context: .
      dockerfile: Dockerfile.http
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}

    # Port configuration - Coolify will auto-proxy this
    ports:
      - "${HTTP_PORT:-8008}:8008"

    # Environment variables from Coolify
    environment:
      # Odoo connection (set these in Coolify's environment variables)
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}

      # Optional Odoo settings
      ODOO_API_VERSION: ${ODOO_API_VERSION:-json-2}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_TIMEOUT: ${ODOO_TIMEOUT:-30}
      ODOO_VERIFY_SSL: ${ODOO_VERIFY_SSL:-1}

      # Optional proxy settings
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}

      # Server configuration
      DEBUG: ${DEBUG:-0}
      PYTHONUNBUFFERED: "1"

    # Volume for logs (Coolify persistent storage)
    volumes:
      - logs-http:/app/logs

    # Health check for Coolify monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Labels for Coolify
    labels:
      - "coolify.managed=true"
      - "coolify.service=odoo-mcp-http"
      - "coolify.type=application"

  # SSE Transport (Alternative for browser access)
  odoo-mcp-sse:
    build:
      context: .
      dockerfile: Dockerfile.sse
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}

    ports:
      - "${SSE_PORT:-8009}:8009"

    environment:
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ODOO_API_VERSION: ${ODOO_API_VERSION:-json-2}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_TIMEOUT: ${ODOO_TIMEOUT:-30}
      ODOO_VERIFY_SSL: ${ODOO_VERIFY_SSL:-1}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      DEBUG: ${DEBUG:-0}
      PYTHONUNBUFFERED: "1"

    volumes:
      - logs-sse:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "coolify.managed=true"
      - "coolify.service=odoo-mcp-sse"
      - "coolify.type=application"

    # Only deploy if SSE is explicitly enabled
    profiles:
      - sse

# Named volumes for persistent storage
volumes:
  logs-http:
    driver: local
  logs-sse:
    driver: local

# Network configuration (Coolify will manage this)
networks:
  default:
    name: coolify
    external: true
