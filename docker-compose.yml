services:
  # SSE Transport (Web Browsers)
  odoo-mcp-sse:
    build:
      context: .
      dockerfile: Dockerfile.sse
      args:
        PYTHON_VERSION: 3.13
    env_file: .env
    ports:
      - "8009:8009"
    volumes:
      # Logs directory (writable)
      - ./logs/sse:/app/logs
      # Source code (read-only) - security: prevents code injection
      - .:/app:ro
      # COOKBOOK (writable) - allows learning from experience
      - ./COOKBOOK.md:/app/COOKBOOK.md:rw
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
    cap_drop:
      - ALL  # Drop all Linux capabilities
    read_only: true  # Container filesystem read-only
    tmpfs:
      - /tmp  # Writable temp directory for Python cache
      - /app/logs  # Writable logs directory

    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8009)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - odoo-mcp-network

  # HTTP Transport (API Integrations)
  odoo-mcp-http:
    build:
      context: .
      dockerfile: Dockerfile.http
      args:
        PYTHON_VERSION: 3.13
    env_file: .env
    ports:
      - "8008:8008"
    volumes:
      # Logs directory (writable)
      - ./logs/http:/app/logs
      # Source code (read-only) - security: prevents code injection
      - .:/app:ro
      # COOKBOOK (writable) - allows learning from experience
      - ./COOKBOOK.md:/app/COOKBOOK.md:rw
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
    cap_drop:
      - ALL  # Drop all Linux capabilities
    read_only: true  # Container filesystem read-only
    tmpfs:
      - /tmp  # Writable temp directory for Python cache
      - /app/logs  # Writable logs directory

    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8008)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - odoo-mcp-network

networks:
  odoo-mcp-network:
    driver: bridge
