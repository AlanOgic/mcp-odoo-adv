[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-mcp"
version = "1.0.0-beta.2"
description = "Advanced MCP Server for Odoo with Multiple Transport Support (STDIO, SSE, HTTP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["odoo", "odoo 18", "odoo 19", "mcp", "odoo-mcp", "mcp server", "server", "docker", "stdio", "sse", "streaming http"]
authors = [
    {name = "Alan Ogic", email = "info@alanogic.com"}
]

dependencies = [
    # FastMCP 3.x only. The 2.x prompt return shape (list of {"role","content"}
    # dicts) is rejected by 3.x, so a 2.x resolution would break the prompts.
    "fastmcp>=3.2,<4",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/AlanOgic/mcp-odoo-adv"
Issues = "https://github.com/AlanOgic/mcp-odoo-adv/issues"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
    "build",
    "twine",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "integration: tests requiring a live Odoo instance",
]

[project.scripts]
odoo-mcp = "odoo_mcp.__main__:main"
odoo-mcp-http = "odoo_mcp.runners.http:main"
odoo-mcp-sse = "odoo_mcp.runners.sse:main"
odoo-mcp-http-secure = "odoo_mcp.runners.http_secure:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["odoo_mcp", "odoo_mcp.runners"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"  # Minimum version for compatibility checking
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
